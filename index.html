<!DOCTYPE html>

<head>
<meta charset="utf-8">
<title>Panel de casa</title>

<style>
:root{--bg:#0d1117;--card:#18202b;--text:#f0f3f8;--muted:#8d98a8;--acc:#58a6ff;--ok:#3fb950;--warn:#f0883e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;height:100%}
.screen{-webkit-flex:1;flex:1;padding:14px 14px 0;min-height:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.off{display:none!important}
.row{display:-webkit-flex;display:flex;min-height:0}
.card{background:var(--card);border-radius:18px;padding:14px 18px;margin:0 7px 14px}
h2{margin:0 0 8px;font-size:19px;font-weight:600;color:var(--muted)}
.top{-webkit-flex:0 0 auto;flex:0 0 auto}
.clockbox{-webkit-flex:1.2;flex:1.2}
#time{font-size:104px;font-weight:200;line-height:1;letter-spacing:-2px}
#date{font-size:25px;color:var(--muted);margin-top:4px}#date::first-letter{text-transform:uppercase}
#tarif{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:14px;font-size:18px;font-weight:600}
.dal{background:#173d22;color:var(--ok)}.nor{background:#4a2c12;color:var(--warn)}
.side{-webkit-flex:1;flex:1}
#temp{font-size:44px;font-weight:300}
#rtxt{font-size:21px;margin:2px 0 8px}
#rbars{display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;height:46px}
#rbars i{-webkit-flex:1;flex:1;margin:0 2px;border-radius:3px 3px 0 0;background:var(--acc);min-height:3px}
.mid{-webkit-flex:1;flex:1}
.bus{-webkit-flex:1;flex:1;overflow:hidden}
.cal{-webkit-flex:1.5;flex:1.5;padding:0;overflow:hidden}
.cal iframe{width:100%;height:100%;border:0;background:#fff;border-radius:18px}

.bt{font-size:17px;color:var(--acc);margin:10px 0 4px}

.bl span{-webkit-flex:1;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bl em{font-style:normal;font-weight:600;margin-left:10px}
.small{font-size:15px;color:var(--muted)}
#papier{-webkit-flex:0 0 auto;flex:0 0 auto;font-size:24px}
#papier.soon{background:#4a2c12}
#tabs{display:-webkit-flex;display:flex;height:60px;background:#0a0e13}

#tabs button.on{color:var(--acc);font-weight:600}
.shop{-webkit-flex:1.6;flex:1.6;overflow:hidden}
.items{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.it{width:16.66%;padding:4px}
.it div{background:#222c3a;border-radius:14px;height:86px;text-align:center;padding-top:8px;font-size:15px;overflow:hidden}
.it div span{display:block;font-size:34px;line-height:1.1}
.it.sel div{background:var(--acc);color:#0d1117;font-weight:600}
.tm{-webkit-flex:1;flex:1;text-align:center}
#tdisp{font-size:92px;font-weight:200;line-height:1.1}
.tb{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
.tb button,.clr{margin:5px;padding:14px 18px;border:0;border-radius:14px;background:#222c3a;color:var(--text);font-size:22px;font-family:inherit}
.tb button.stop{background:#5a1f1f}
#night{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:20;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
body.night #night{display:-webkit-flex;display:flex}
#ntime{font-size:110px;font-weight:200;color:#3a3a3a}
#alarm{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#b3261e;z-index:30;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;font-size:64px;text-align:center}
#alarm.on{display:-webkit-flex;display:flex}
/* Dashboard refresh: compact cards, clear departure hierarchy and agenda */
.screen{gap:0}
.top{height:25%;min-height:155px}
.mid{flex:1;min-height:0;gap:0}
.clockbox{flex:1.15}
.side{flex:.85}
.bus{flex:.72;min-width:0;overflow:auto}
.cal{flex:2.1;min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:16px 18px}
.cal iframe{flex:1;min-height:0;width:100%;height:auto;border:0;border-radius:12px;background:#fff}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.cal-head h2{margin:0;color:var(--text);font-size:19px}
.cal-head a,.bus-link{font-size:13px;color:var(--acc);text-decoration:none}
.agenda-actions{display:flex;align-items:center;gap:8px}
.agenda-btn{border:0;border-radius:9px;background:#26364a;color:#dce9f8;padding:8px 11px;font-size:13px;font-weight:600}
.agenda-status{font-size:11px;color:#8995a5;margin:1px 0 5px;letter-spacing:.01em}
.agenda-list{flex:1;min-height:0;overflow:auto;padding:0 3px 0 0}
.agenda-day{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px solid rgba(148,163,184,.13)}
.agenda-date{color:#9ba7b6;text-align:left;text-transform:uppercase;font-size:9px;line-height:1.15;padding-top:2px;letter-spacing:.06em}
.agenda-date strong{display:block;color:#e5eaf0;font-size:23px;font-weight:400;line-height:1}
.agenda-date span{display:block;margin-top:3px}
.agenda-events{min-width:0}
.agenda-event{border:0;border-bottom:1px solid rgba(148,163,184,.10);background:transparent;border-radius:0;padding:4px 0 5px;margin:0}

.agenda-event summary::-webkit-details-marker{display:none}
.agenda-event-title{font-size:13px;font-weight:500;color:#e4e9ef;line-height:1.25;overflow-wrap:anywhere}
.agenda-event-meta{font-size:10px;color:#98a5b5;margin:0;line-height:1.3}

@media(max-width:760px){.agenda-day{grid-template-columns:39px minmax(0,1fr);gap:7px;padding:5px 0}.agenda-date strong{font-size:20px}.agenda-event summary{grid-template-columns:65px minmax(0,1fr);gap:6px}.agenda-event-title{font-size:12px}.agenda-event-meta{font-size:9px}.agenda-event-detail{margin-left:71px}.agenda-status{font-size:10px}}

.bus-group{padding:8px 0 10px;border-top:1px solid #303a48}
.bus-group:first-of-type{border-top:0}
.bus-route-title{font-size:13px;color:var(--muted);margin-bottom:7px}
.departure{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:9px;padding:7px 0}
.dep-line{font-size:18px;font-weight:700;text-align:center;background:var(--acc);color:#0d1117;border-radius:9px;padding:5px 3px}
.dep-destination{font-size:16px;font-weight:600;line-height:1.15}
.dep-route{font-size:12px;color:var(--muted);margin-top:3px}
.dep-min{font-size:22px;font-weight:700;white-space:nowrap}
.bus-state{font-size:13px;color:var(--muted);padding:6px 0}
.bus-meta{font-size:11px;color:var(--muted);margin-top:6px}
@media(max-width:760px){
 .screen{padding:8px 8px 0}
 .top{height:29%;min-height:140px}
 #time{font-size:clamp(54px,12vw,82px)}
 #date{font-size:17px}
 .card{padding:10px 11px;margin:0 4px 8px}
 h2{font-size:15px}
 .mid{gap:0}
 .bus{flex:.72;min-width:0}
 .cal{flex:1.9;min-width:0;padding:12px}
 .dep-min{font-size:17px}
 .dep-destination{font-size:13px}
 .dep-line{font-size:15px}
 .departure{grid-template-columns:40px minmax(0,1fr) auto;gap:6px;padding:5px 0}
 .bus-route-title{font-size:11px}
}

<body>
<div id="night"><div id="ntime"></div></div>
<div id="alarm">⏰ ¡Tiempo!<br><span style="font-size:26px">Toca para cerrar</span></div>
<div id="app">
  <div id="s1" class="screen">
    <div class="row top">
      <div class="card clockbox"><div id="time">--:--</div><div id="date"></div><div id="tarif"></div></div>
      <div class="card side"><h2>🌧️ Lluvia · próximas 2 h</h2><div id="temp"></div><div id="rtxt">Cargando…</div><div id="rbars"></div></div>
    </div>
    <div class="row mid">
      <div class="card bus"><h2>🚌 Autobuses</h2><div id="bus0"></div><div id="bus1"></div><div class="small" id="busup"></div></div>

        <div class="tb" id="tpre"></div>
        <div class="tb"><button id="tplus">+1 min</button><button class="stop" id="tstop">Parar</button></div>
        <div style="margin-top:22px"><button class="clr" id="clr">Vaciar lista de la compra</button></div>
      </div>
    </div>
  </div>
  <div id="tabs"><button class="on" data-s="s1">🏠 Inicio</button><button data-s="s2">🛒 Cocina</button></div>
</div>
<script>
(function(){
/* ===== CONFIGURACIÓN: cambia solo esto ===== */
var CFG={
  lat:51.44, lon:5.50,                 /* Eindhoven */
  calUrl:"https://calendar.google.com/calendar/embed?src=alinageorgia1993%40gmail.com&ctz=Europe%2FAmsterdam&mode=AGENDA&showTitle=0&showNav=0&showTabs=0&showPrint=0&showCalendars=0&showTz=0",
  papierDates:["2026-11-17","2026-12-01","2026-12-15","2026-12-29"],
  nightFrom:23, nightTo:6              /* modo noche */
};
var STOPS=[
  {title:"Churchilllaan → WoensXL", lines:["323","404"], dest:"Eindhoven Station", url:"https://www.drgl.nl/stop/NL:S:64051510", api:"http://v0.ovapi.nl/tpc/64051510/departures"},
  {title:"WoensXL → Aeropuerto", lines:["400"], dest:"Airport", url:"https://www.drgl.nl/stop/NL:S:64052010", api:"http://v0.ovapi.nl/tpc/64052010/departures"}
];
var ITEMS=[["🥛","Leche"],["🍞","Pan"],["🥚","Huevos"],["🍎","Fruta"],["🥦","Verdura"],["🥔","Patatas"],["🥩","Carne"],["🐟","Pescado"],["🧀","Queso"],["🥣","Yogur"],["🧈","Mantequilla"],["🍝","Pasta"],["🍚","Arroz"],["☕","Café"],["💧","Agua"],["🍷","Bebidas"],["🍪","Snacks"],["🧻","Papel WC"],["🧴","Limpieza"],["🗑️","Bolsas basura"]];
/* ============================================ */

function $(i){return document.getElementById(i);}
function dos(n){return n<10?"0"+n:""+n;}
var DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;}
function fj(u){return fetch(u).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});}
function getJSON(u,ok,bad,px){var p=fj(u);if(px){p=p.catch(function(){return fj("https://api.allorigins.win/raw?url="+encodeURIComponent(u));});}p.then(ok,bad);}

/* --- reloj, tarifa, modo noche --- */
var wake=0;
function tarif(d){
  var day=d.getDay(),h=d.getHours(),dal=(day===0||day===6||h>=23||h<7),t;
  if(dal){t=((day===5&&h>=23)||day===6||day===0)?"hasta el lunes a las 7:00":"hasta las 7:00";}
  else{t="hasta las 23:00";}
  var e=$("tarif");e.className=dal?"dal":"nor";
  e.textContent=(dal?"Tarifa DAL (barata) ":"Tarifa normaal ")+t;
}
function isNight(d){var h=d.getHours();return h>=CFG.nightFrom||h<CFG.nightTo;}
function tick(){
  var d=new Date(),hm=dos(d.getHours())+":"+dos(d.getMinutes());
  $("time").textContent=hm;$("ntime").textContent=hm;
  $("date").textContent=DIAS[d.getDay()]+", "+d.getDate()+" de "+MESES[d.getMonth()];
  tarif(d);
  document.body.className=(isNight(d)&&Date.now()>wake)?"night":"";
  papier(d);
}
document.addEventListener("touchstart",function(){wake=Date.now()+30000;document.body.className="";});

/* --- calendario oficial de papel y cartón (Cure 2026) --- */
function papier(d){
  var el=$("papier"),today=new Date(d.getFullYear(),d.getMonth(),d.getDate()),dates=CFG.papierDates||[],upcoming=[],i,parts,dt,diff,label;
  for(i=0;i<dates.length;i++){
    parts=dates[i].split("-");dt=new Date(+parts[0],+parts[1]-1,+parts[2]);
    if(dt.getTime()>=today.getTime())upcoming.push({date:dt,diff:Math.round((dt-today)/86400000)});
  }
  if(!upcoming.length){el.textContent="♻️ Papel y cartón: no hay más fechas en el calendario PDF de 2026. Consulta Cure para las fechas de 2027.";el.className="card";return;}
  dt=upcoming[0].date;diff=upcoming[0].diff;
  label=diff===0?"HOY":(diff===1?"MAÑANA":"en "+diff+" días");
  var h='<div style="font-size:20px;font-weight:600">♻️ Papel y cartón</div><div style="font-size:18px;margin-top:5px">Próxima recogida: '+DIAS[dt.getDay()]+' '+dt.getDate()+' de '+MESES[dt.getMonth()]+' · '+label+'</div><div class="small" style="margin-top:7px">';
  for(i=0;i<upcoming.length;i++){h+=(i?" · ":"Próximas fechas: ")+upcoming[i].date.getDate()+"/"+dos(upcoming[i].date.getMonth()+1);}
  h+='</div><div class="small" style="margin-top:5px">Fuente: calendario Cure 2026 · versión 16-11-2026</div>';
  el.innerHTML=h;el.className="card"+(diff<=1?" soon":"");
}

/* --- lluvia (Open-Meteo) --- */
function rain(){
  var u="https://api.open-meteo.com/v1/forecast?latitude="+CFG.lat+"&longitude="+CFG.lon+"&current=temperature_2m&minutely_15=precipitation&forecast_minutely_15=8&timezone=Europe%2FAmsterdam";
  getJSON(u,function(j){
    var p=j.minutely_15.precipitation,i,max=0,first=-1,h="";
    for(i=0;i<p.length;i++){if(p[i]>max)max=p[i];if(first<0&&p[i]>=0.05)first=i;}
    $("temp").textContent=Math.round(j.current.temperature_2m)+"°C";
    $("rtxt").textContent=first<0?"Sin lluvia en las próximas 2 horas":(first===0?"Está lloviendo ahora":"Lluvia en unos "+(first*15)+" min");
    for(i=0;i<p.length;i++){h+='<i style="height:'+Math.min(46,3+p[i]*40)+'px"></i>';}
    $("rbars").innerHTML=h;
  },function(){$("rtxt").textContent="No se pudo cargar el tiempo";});
}

/* --- Autobuses: salidas Hermes resumidas en tarjetas --- */
var HERMES=[
 {title:"Churchilllaan → WoensXL",line:["323","404"],direction:"Eindhoven Station",label:"323 / 404",stop:"https://www.hermes.nl/nl/resultaten/halte-informatie?stop=%7B%22stopid%22%3A%22NL:S:64051510%22,%22town%22:%22Eindhoven%22,%22name%22:%22Churchilllaan%22%7D"},
 {title:"WoensXL → Aeropuerto",line:["400"],direction:"Airport",label:"400",stop:"https://www.hermes.nl/nl/resultaten/halte-informatie?stop=%7B%22stopid%22%3A%22NL:S:64052010%22,%22town%22:%22Eindhoven%22,%22name%22:%22WoensXL/ZH Catharina%22%7D"}
];
var hermesData=[[],[]],hermesLast=[0,0],hermesError=[false,false];
function hermesMinutes(v){
 var m=v.match(/over\s+(\d+)\s+min/i);if(m)return +m[1];
 var t=v.match(/\b(\d{1,2}):(\d{2})\b/);if(t){var now=new Date(),n=+t[1]*60+(+t[2]),cur=now.getHours()*60+now.getMinutes();return (n-cur+1440)%1440;}
 return null;
}
function parseHermesText(raw,stop){
 var txt=raw.replace(/\r/g,"\n").replace(/\*+/g," ").replace(/[ \t]+/g," "),out=[],re=/Lijnnummer\s*(\d+)[\s\S]{0,220}?Richting\s*(?:Richting\s*)?([^\n]+)[\s\S]{0,180}?(over\s+\d+\s+min|\b\d{1,2}:\d{2}\b)/gi,m;
 while((m=re.exec(txt))!==null){
  var line=m[1].trim(),dir=m[2].replace(/^[：:]\s*/,"").trim(),mins=hermesMinutes(m[3]);
  if(stop.line.indexOf(line)<0||dir.toLowerCase().indexOf(stop.direction.toLowerCase())<0||mins===null)continue;
  out.push({line:line,direction:dir,mins:mins,at:Date.now()});
 }
 out.sort(function(x,y){return x.mins-y.mins;});
 var unique=[];out.forEach(function(x){if(!unique.some(function(y){return y.line===x.line&&y.mins===x.mins;}))unique.push(x);});
 return unique.slice(0,2);
}
function hermesFetch(i){
 var stop=HERMES[i],proxy="https://r.jina.ai/http://"+stop.stop.replace(/^https?:\/\//,"");
 fetch(proxy,{cache:"no-store",headers:{"Accept":"text/plain","X-Return-Format":"text"}})
 .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text();})
 .then(function(txt){var d=parseHermesText(txt,stop);if(!d.length)throw new Error("No se encontraron salidas válidas");hermesData[i]=d;hermesLast[i]=Date.now();hermesError[i]=false;renderHermes();})
 .catch(function(){hermesError[i]=true;renderHermes();});
}
function renderHermes(){
 HERMES.forEach(function(stop,i){
  var box=$("bus"+i);if(!box)return;
  var d=hermesData[i],html='<section class="bus-group"><div class="bus-route-title">'+stop.title+'</div><div class="hermes-line">'+stop.label+'</div>';
  if(!d.length){html+='<div class="bus-state">'+(hermesError[i]?'No se pudo obtener la salida en vivo de Hermes.':'Consultando salidas actuales…')+'</div>';}
  else{
   var first=d[0],second=d[1],m=Math.max(0,first.mins-Math.floor((Date.now()-first.at)/60000));
   html+='<div class="hermes-caption">Próximo bus</div><div class="hermes-big">En '+m+' minutos</div><div class="hermes-direction">Dirección: '+stop.direction+'</div>';
   if(second){var m2=Math.max(0,second.mins-Math.floor((Date.now()-second.at)/60000));html+='<div class="hermes-next-label">Siguiente bus</div><div class="hermes-next">En '+m2+' minutos</div>';}
   else{html+='<div class="hermes-next-label">Siguiente bus</div><div class="bus-state">Aún no hay otro horario disponible.</div>';}
  }
  html+='<div class="bus-meta">'+(hermesLast[i]?'Actualizado '+new Date(hermesLast[i]).toLocaleTimeString('es-NL',{hour:'2-digit',minute:'2-digit'}):'Fuente: Hermes')+'</div></section>';
  box.innerHTML=html;
 });
 $("busup").textContent="Salidas oficiales Hermes · consulta cada 25 segundos";
}
function startHermes(){renderHermes();hermesFetch(0);hermesFetch(1);setInterval(function(){hermesFetch(0);hermesFetch(1);},25000);setInterval(renderHermes,30000);}
/* --- agenda Google Calendar: OAuth de solo lectura + agenda agrupada --- */
var GOOGLE_CLIENT_ID="338582084819-v6mm7auokf0ct40rni42h73nkcha0du2.apps.googleusercontent.com";
var CALENDARS=[
 {id:"alinageorgia1993@gmail.com",name:"Personal",color:"#a9c3d8"},
 {id:"i31jakd1kfame3uctdr6vt4v88@group.calendar.google.com",name:"Global Marketing",color:"#c5b1d8"},
 {id:"es.spain#holiday@group.v.calendar.google.com",name:"Festivos España",color:"#aec7b4"}
];
var agendaToken=null,agendaTokenExpiry=0,agendaTimer=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];});}
function agendaShell(){
 $("cal").innerHTML='<div class="cal-head"><div><h2>MI AGENDA</h2><div style="font-size:11px;color:#8995a5;margin-top:2px">Próximos eventos</div></div><div class="agenda-actions"><button class="agenda-btn" id="agenda-login">Conectar</button></div></div><div class="agenda-status" id="agenda-status">Conecta tu cuenta para consultar tus próximos eventos.</div><div class="agenda-list" id="agenda-list"><div class="agenda-empty">Tu agenda aparecerá aquí después de iniciar sesión.</div></div>';
 $("agenda-login").addEventListener("click",function(){connectCalendar();});
}
function agendaMessage(msg){var el=$("agenda-status");if(el)el.textContent=msg;}
function connectCalendar(){
 if(!window.google||!google.accounts||!google.accounts.oauth2){agendaMessage("No se ha podido cargar el acceso de Google. Recarga la página e inténtalo de nuevo.");return;}
 try{
  var tokenClient=google.accounts.oauth2.initTokenClient({
   client_id:GOOGLE_CLIENT_ID,
   scope:"https://www.googleapis.com/auth/calendar.readonly",
   callback:function(resp){
    if(resp&&resp.access_token){
     agendaToken=resp.access_token;
     agendaTokenExpiry=Date.now()+(Number(resp.expires_in||3600)-60)*1000;
     agendaMessage("Conectado a Google Calendar · cargando eventos…");
     loadAgenda();
     if(agendaTimer)clearInterval(agendaTimer);
     agendaTimer=setInterval(function(){if(agendaToken&&Date.now()<agendaTokenExpiry){loadAgenda();}else{agendaToken=null;agendaMessage("La sesión ha caducado. Pulsa «Conectar Google» para actualizarla.");clearInterval(agendaTimer);}},5*60*1000);
    }else{agendaMessage("Google no ha concedido acceso. Comprueba la autorización e inténtalo de nuevo.");}
   },
   error_callback:function(){agendaMessage("No se ha podido iniciar sesión con Google. Comprueba la configuración OAuth.");}
  });
  tokenClient.requestAccessToken({prompt:agendaToken?"":"consent"});
 }catch(e){agendaMessage("Error al iniciar la conexión con Google Calendar.");}
}
function calendarRequest(cal,from,to){
 var url="https://www.googleapis.com/calendar/v3/calendars/"+encodeURIComponent(cal.id)+"/events?"+[
  "timeMin="+encodeURIComponent(from),
  "timeMax="+encodeURIComponent(to),
  "singleEvents=true","orderBy=startTime","maxResults=40"
 ].join("&");
 return fetch(url,{headers:{Authorization:"Bearer "+agendaToken}}).then(function(r){
  if(!r.ok){if(r.status===401)agendaToken=null;throw new Error("Calendar API "+r.status);}
  return r.json();
 }).then(function(j){return (j.items||[]).map(function(ev){ev._calendar=cal;return ev;});});
}
function eventDate(ev){return ev.start&&(ev.start.dateTime||ev.start.date)?new Date(ev.start.dateTime||ev.start.date+"T00:00:00"):null;}
function eventEnd(ev){return ev.end&&(ev.end.dateTime||ev.end.date)?new Date(ev.end.dateTime||ev.end.date+"T00:00:00"):null;}
function eventTime(ev){
 if(ev.start&&ev.start.date)return "Todo el día";
 var d=eventDate(ev),e=eventEnd(ev);
 if(!d)return "";
 return new Intl.DateTimeFormat("es-ES",{timeZone:"Europe/Amsterdam",hour:"2-digit",minute:"2-digit"}).format(d)+(e?" – "+new Intl.DateTimeFormat("es-ES",{timeZone:"Europe/Amsterdam",hour:"2-digit",minute:"2-digit"}).format(e):"");
}
function renderAgenda(events){
 var groups={},keys=[],html="",now=new Date();
 events.sort(function(a,b){return eventDate(a)-eventDate(b);});
 events.forEach(function(ev){
  var d=eventDate(ev);if(!d)return;
  var key=ev.start.date||new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Amsterdam",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
  if(!groups[key]){groups[key]=[];keys.push(key);}groups[key].push(ev);
 });
 keys.sort();
 if(!keys.length){$("agenda-list").innerHTML='<div class="agenda-empty">No hay eventos próximos en los calendarios seleccionados.</div>';return;}
 keys.forEach(function(key){
  var parts=key.split("-"),date=new Date(+parts[0],+parts[1]-1,+parts[2]);
  html+='<section class="agenda-day"><div class="agenda-date"><strong>'+date.getDate()+'</strong><span>'+esc(DIAS[date.getDay()].slice(0,3))+'</span><span>'+esc(MESES[date.getMonth()].slice(0,3))+'</span></div><div class="agenda-events">';
  groups[key].forEach(function(ev){
   var cal=ev._calendar,detail=[];
   if(ev.location)detail.push("📍 "+ev.location);
   if(ev.description)detail.push(ev.description);
   html+='<details class="agenda-event" style="--event-color:'+cal.color+'"><summary><div class="agenda-event-meta">'+esc(eventTime(ev))+'</div><div class="agenda-event-title"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+cal.color+';margin:0 6px 1px 0"></span>'+esc(ev.summary||"(Sin título)")+' <span style="font-size:10px;color:#8491a1;font-weight:400">· '+esc(cal.name)+'</span></div></summary>'+(detail.length?'<div class="agenda-event-detail">'+esc(detail.join("\n\n"))+'</div>':'')+'</details>';
  });
  html+='</div></section>';
 });
 $("agenda-list").innerHTML=html;
}
function loadAgenda(){
 if(!agendaToken){agendaMessage("Conecta tu cuenta para consultar tus próximos eventos.");return;}
 var now=new Date(),from=now.toISOString(),to=new Date(now.getTime()+60*86400000).toISOString();
 agendaMessage("Actualizando agenda…");
 Promise.all(CALENDARS.map(function(cal){return calendarRequest(cal,from,to);})).then(function(results){
  var all=[];results.forEach(function(a){all=all.concat(a);});
  renderAgenda(all);
  agendaMessage("Actualizada: "+new Intl.DateTimeFormat("es-ES",{timeZone:"Europe/Amsterdam",hour:"2-digit",minute:"2-digit"}).format(new Date())+" · próximos 60 días");
  var b=$("agenda-login");if(b)b.textContent="Actualizar acceso";
 }).catch(function(err){
  agendaMessage(agendaToken?"No se pudieron cargar los eventos. Comprueba que los calendarios están compartidos con tu cuenta y que la API está habilitada.":"La sesión de Google ha caducado. Pulsa «Conectar Google» para volver a autorizar.");
  if(!agendaToken){var b=$("agenda-login");if(b)b.textContent="Conectar Google";}
 });
}
agendaShell();
/* --- lista de la compra --- */
var sel={};try{sel=JSON.parse(ls("lista")||"{}");}catch(e){}
function drawItems(){
  var h="",i;
  for(i=0;i<ITEMS.length;i++){h+='<div class="it'+(sel[i]?" sel":"")+'" data-i="'+i+'"><div><span>'+ITEMS[i][0]+'</span>'+ITEMS[i][1]+'</div></div>';}
  $("items").innerHTML=h;
}
$("items").addEventListener("click",function(e){
  var n=e.target;while(n&&!n.getAttribute("data-i")){n=n.parentNode;if(n===document)return;}
  if(!n)return;var i=n.getAttribute("data-i");sel[i]=!sel[i];ls("lista",JSON.stringify(sel));drawItems();
});
$("clr").addEventListener("click",function(){if(confirm("¿Vaciar la lista?")){sel={};ls("lista","{}");drawItems();}});
drawItems();

/* --- temporizador --- */
var ac,tEnd=0,tInt=null,aInt=null;
function ainit(){try{var C=window.AudioContext||window.webkitAudioContext;if(!ac&&C)ac=new C();if(ac&&ac.resume)ac.resume();}catch(e){}}
function beep(){if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=0.3;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.3);}
function tshow(s){$("tdisp").textContent=dos(Math.floor(s/60))+":"+dos(s%60);}
function ttick(){var s=Math.ceil((tEnd-Date.now())/1000);if(s<=0){clearInterval(tInt);tInt=null;tshow(0);alarm();return;}tshow(s);}
function tstart(sec){ainit();tEnd=Date.now()+sec*1000;clearInterval(tInt);tInt=setInterval(ttick,250);ttick();}
function alarm(){var n=0;$("alarm").className="on";beep();clearInterval(aInt);aInt=setInterval(function(){beep();if(++n>8){clearInterval(aInt);}},1200);}
$("alarm").addEventListener("click",function(){$("alarm").className="";clearInterval(aInt);});
var pre=[1,3,5,10,15,30],ph="",q;
for(q=0;q<pre.length;q++){ph+='<button data-m="'+pre[q]+'">'+pre[q]+' min</button>';}
$("tpre").innerHTML=ph;
$("tpre").addEventListener("click",function(e){var m=e.target.getAttribute("data-m");if(m)tstart(+m*60);});
$("tplus").addEventListener("click",function(){if(tInt){tEnd+=60000;ttick();}else{tstart(60);}});
$("tstop").addEventListener("click",function(){clearInterval(tInt);tInt=null;tshow(0);});

/* --- pestañas --- */
var tabs=document.querySelectorAll("#tabs button");
for(q=0;q<tabs.length;q++){tabs[q].addEventListener("click",function(){
  var t=document.querySelectorAll("#tabs button"),j;
  for(j=0;j<t.length;j++){t[j].className="";$(t[j].getAttribute("data-s")).className="screen"+(t[j]===this?"":" off");}
  this.className="on";});}

tick();setInterval(tick,5000);
rain();setInterval(rain,300000);
startHermes();
setInterval(function(){location.reload();},6*3600*1000);
})();
