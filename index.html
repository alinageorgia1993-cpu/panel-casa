<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel de casa</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<style>
:root{--bg:#0d1117;--card:#18202b;--text:#f0f3f8;--muted:#8d98a8;--acc:#58a6ff;--ok:#3fb950;--warn:#f0883e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;height:100%}
.screen{-webkit-flex:1;flex:1;padding:14px 14px 0;min-height:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.off{display:none!important}
.row{display:-webkit-flex;display:flex;min-height:0}
.card{background:var(--card);border-radius:18px;padding:14px 18px;margin:0 7px 14px}
h2{margin:0 0 8px;font-size:19px;font-weight:600;color:var(--muted)}
.top{-webkit-flex:0 0 auto;flex:0 0 auto}
.clockbox{-webkit-flex:1.2;flex:1.2}
#time{font-size:104px;font-weight:200;line-height:1;letter-spacing:-2px}
#date{font-size:25px;color:var(--muted);margin-top:4px;text-transform:capitalize}
#tarif{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:14px;font-size:18px;font-weight:600}
.dal{background:#173d22;color:var(--ok)}.nor{background:#4a2c12;color:var(--warn)}
.side{-webkit-flex:1;flex:1}
#temp{font-size:44px;font-weight:300}
#rtxt{font-size:21px;margin:2px 0 8px}
#rbars{display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;height:46px}
#rbars i{-webkit-flex:1;flex:1;margin:0 2px;border-radius:3px 3px 0 0;background:var(--acc);min-height:3px}
.mid{-webkit-flex:1;flex:1}
.bus{-webkit-flex:1;flex:1;overflow:hidden}
.cal{-webkit-flex:1.5;flex:1.5;padding:0;overflow:hidden}
.cal iframe{width:100%;height:100%;border:0;background:#fff;border-radius:18px}
.cal p{padding:18px;color:var(--muted);font-size:18px}
.bt{font-size:17px;color:var(--acc);margin:10px 0 4px}
.bl{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;font-size:22px;padding:5px 0}
.bl b{background:var(--acc);color:#0d1117;border-radius:8px;padding:1px 9px;min-width:50px;text-align:center;margin-right:12px}
.bl span{-webkit-flex:1;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bl em{font-style:normal;font-weight:600;margin-left:10px}
.small{font-size:15px;color:var(--muted)}
#papier{-webkit-flex:0 0 auto;flex:0 0 auto;font-size:24px}
#papier.soon{background:#4a2c12}
#tabs{display:-webkit-flex;display:flex;height:60px;background:#0a0e13}
#tabs button{-webkit-flex:1;flex:1;border:0;background:none;color:var(--muted);font-size:22px;font-family:inherit}
#tabs button.on{color:var(--acc);font-weight:600}
.shop{-webkit-flex:1.6;flex:1.6;overflow:hidden}
.items{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.it{width:16.66%;padding:4px}
.it div{background:#222c3a;border-radius:14px;height:86px;text-align:center;padding-top:8px;font-size:17px}
.it div span{display:block;font-size:34px;line-height:1.1}
.it.sel div{background:var(--acc);color:#0d1117;font-weight:600}
.tm{-webkit-flex:1;flex:1;text-align:center}
#tdisp{font-size:92px;font-weight:200;line-height:1.1}
.tb{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
.tb button,.clr{margin:5px;padding:14px 18px;border:0;border-radius:14px;background:#222c3a;color:var(--text);font-size:22px;font-family:inherit}
.tb button.stop{background:#5a1f1f}
#night{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:20;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
body.night #night{display:-webkit-flex;display:flex}
#ntime{font-size:110px;font-weight:200;color:#3a3a3a}
#alarm{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#b3261e;z-index:30;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;font-size:64px;text-align:center}
#alarm.on{display:-webkit-flex;display:flex}
</style>
</head>
<body>
<div id="night"><div id="ntime"></div></div>
<div id="alarm">⏰ ¡Tiempo!<br><span style="font-size:26px">Toca para cerrar</span></div>
<div id="app">
  <div id="s1" class="screen">
    <div class="row top">
      <div class="card clockbox"><div id="time">--:--</div><div id="date"></div><div id="tarif"></div></div>
      <div class="card side"><h2>🌧️ Lluvia · próximas 2 h</h2><div id="temp"></div><div id="rtxt">Cargando…</div><div id="rbars"></div></div>
    </div>
    <div class="row mid">
      <div class="card bus"><h2>🚌 Autobuses</h2><div id="bus0"></div><div id="bus1"></div><div class="small" id="busup"></div></div>
      <div class="card cal" id="cal"></div>
    </div>
    <div class="card" id="papier"></div>
  </div>
  <div id="s2" class="screen off">
    <div class="row" style="-webkit-flex:1;flex:1">
      <div class="card shop"><h2>🛒 Lista de la compra · toca lo que falta</h2><div class="items" id="items"></div></div>
      <div class="card tm"><h2>⏱️ Temporizador</h2><div id="tdisp">00:00</div>
        <div class="tb" id="tpre"></div>
        <div class="tb"><button id="tplus">+1 min</button><button class="stop" id="tstop">Parar</button></div>
        <div style="margin-top:22px"><button class="clr" id="clr">Vaciar lista de la compra</button></div>
      </div>
    </div>
  </div>
  <div id="tabs"><button class="on" data-s="s1">🏠 Inicio</button><button data-s="s2">🛒 Cocina</button></div>
</div>
<script>
(function(){
/* ===== CONFIGURACIÓN: cambia solo esto ===== */
var CFG={
  lat:51.44, lon:5.50,                 /* Eindhoven */
  calUrl:"",                           /* pega aquí la URL de incrustar de Google Calendar */
  papierFirst:"",                      /* una fecha de papel y cartón, formato AAAA-MM-DD */
  papierEvery:28,                      /* cada cuántos días (4 semanas) */
  nightFrom:23, nightTo:6              /* modo noche */
};
var STOPS=[
  {title:"Churchillaan → Woensel XL", name:"Churchillaan", town:"Eindhoven", lines:null, dest:""},
  {title:"Woensel XL → Aeropuerto (400)", name:"Woensel XL", town:"Eindhoven", lines:["400"], dest:""}
];
var ITEMS=[["🥛","Leche"],["🍞","Pan"],["🥚","Huevos"],["🍎","Fruta"],["🥦","Verdura"],["🥔","Patatas"],["🥩","Carne"],["🐟","Pescado"],["🧀","Queso"],["🥣","Yogur"],["🧈","Mantequilla"],["🍝","Pasta"],["🍚","Arroz"],["☕","Café"],["💧","Agua"],["🍷","Bebidas"],["🍪","Snacks"],["🧻","Papel WC"],["🧴","Limpieza"],["🗑️","Bolsas basura"]];
/* ============================================ */

function $(i){return document.getElementById(i);}
function dos(n){return n<10?"0"+n:""+n;}
var DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;}
function getJSON(u,ok,bad){fetch(u).then(function(r){if(!r.ok)throw new Error("http");return r.json();}).then(ok).catch(bad);}

/* --- reloj, tarifa, modo noche --- */
var wake=0;
function tarif(d){
  var day=d.getDay(),h=d.getHours(),dal=(day===0||day===6||h>=23||h<7),t;
  if(dal){t=((day===5&&h>=23)||day===6||day===0)?"hasta el lunes a las 7:00":"hasta las 7:00";}
  else{t="hasta las 23:00";}
  var e=$("tarif");e.className=dal?"dal":"nor";
  e.textContent=(dal?"Tarifa DAL (barata) ":"Tarifa normaal ")+t;
}
function isNight(d){var h=d.getHours();return h>=CFG.nightFrom||h<CFG.nightTo;}
function tick(){
  var d=new Date(),hm=dos(d.getHours())+":"+dos(d.getMinutes());
  $("time").textContent=hm;$("ntime").textContent=hm;
  $("date").textContent=DIAS[d.getDay()]+", "+d.getDate()+" de "+MESES[d.getMonth()];
  tarif(d);
  document.body.className=(isNight(d)&&Date.now()>wake)?"night":"";
  papier(d);
}
document.addEventListener("touchstart",function(){wake=Date.now()+30000;document.body.className="";});

/* --- papel y cartón --- */
function papier(d){
  var el=$("papier");
  if(!CFG.papierFirst){el.textContent="♻️ Papel y cartón: falta poner una fecha de recogida en la configuración.";return;}
  var p=CFG.papierFirst.split("-"),f=new Date(+p[0],+p[1]-1,+p[2]),t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var step=CFG.papierEvery*86400000,n=f.getTime();
  if(t.getTime()>n){n+=Math.ceil((t.getTime()-n)/step)*step;}
  var nd=new Date(n),diff=Math.round((n-t.getTime())/86400000),txt;
  if(diff===0)txt="HOY se recoge";else if(diff===1)txt="MAÑANA: saca el contenedor esta noche";else txt="en "+diff+" días";
  el.textContent="♻️ Papel y cartón: "+DIAS[nd.getDay()]+" "+nd.getDate()+" de "+MESES[nd.getMonth()]+" · "+txt;
  el.className="card"+(diff<=1?" soon":"");
}

/* --- lluvia (Open-Meteo) --- */
function rain(){
  var u="https://api.open-meteo.com/v1/forecast?latitude="+CFG.lat+"&longitude="+CFG.lon+"&current=temperature_2m&minutely_15=precipitation&forecast_minutely_15=8&timezone=Europe%2FAmsterdam";
  getJSON(u,function(j){
    var p=j.minutely_15.precipitation,i,max=0,first=-1,h="";
    for(i=0;i<p.length;i++){if(p[i]>max)max=p[i];if(first<0&&p[i]>=0.05)first=i;}
    $("temp").textContent=Math.round(j.current.temperature_2m)+"°C";
    $("rtxt").textContent=first<0?"Sin lluvia en las próximas 2 horas":(first===0?"Está lloviendo ahora":"Lluvia en unos "+(first*15)+" min");
    for(i=0;i<p.length;i++){h+='<i style="height:'+Math.min(46,3+p[i]*40)+'px"></i>';}
    $("rbars").innerHTML=h;
  },function(){$("rtxt").textContent="No se pudo cargar el tiempo";});
}

/* --- autobuses (OVapi) --- */
function minsTo(t){
  var m=/(\d+)-(\d+)-(\d+)T(\d+):(\d+)/.exec(t||"");if(!m)return null;
  return Math.round((new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5])-new Date())/60000);
}
function areas(s,ok,bad){
  var key="ov3_"+s.name,c=ls(key);
  if(c){try{var a=JSON.parse(c);if(a.length){ok(a);return;}}catch(e){}}
  getJSON("https://v0.ovapi.nl/stopareacode",function(all){
    var out=[],n=s.name.toLowerCase(),t=s.town.toLowerCase(),k,o,nm,tw,code;
    for(k in all){o=all[k];if(!o)continue;nm=(o.TimingPointName||"").toLowerCase();tw=(o.TimingPointTown||"").toLowerCase();
      if(nm.indexOf(n)>-1&&(nm.indexOf(t)>-1||tw.indexOf(t)>-1)){code=o.StopAreaCode||k;if(out.indexOf(code)<0)out.push(code);}}
    if(!out.length){bad();return;}
    ls(key,JSON.stringify(out));ok(out);
  },bad);
}
function bus(i){
  var s=STOPS[i],box=$("bus"+i);
  function fail(){box.innerHTML='<div class="bt">'+s.title+'</div><div class="small">No se pudieron cargar los horarios.</div>';}
  areas(s,function(a){
    getJSON("https://v0.ovapi.nl/stopareacode/"+a.join(","),function(data){
      var list=[],ar,tp,ps,id,x,m,ln;
      for(ar in data){for(tp in data[ar]){ps=data[ar][tp].Passes||{};
        for(id in ps){x=ps[id];ln=x.LinePublicNumber;
          if(s.lines&&s.lines.indexOf(ln)<0)continue;
          if(s.dest&&(x.DestinationName50||"").toLowerCase().indexOf(s.dest)<0)continue;
          if(x.TripStopStatus==="CANCEL")continue;
          m=minsTo(x.ExpectedDepartureTime||x.TargetDepartureTime||x.ExpectedArrivalTime);
          if(m===null||m<-1)continue;
          list.push({l:ln,d:x.DestinationName50||"",m:m,t:(x.ExpectedDepartureTime||x.TargetDepartureTime||"").substr(11,5)});}}}
      list.sort(function(p,q){return p.m-q.m;});
      var h='<div class="bt">'+s.title+'</div>',k;
      if(!list.length)h+='<div class="small">Sin salidas próximas</div>';
      for(k=0;k<Math.min(3,list.length);k++){
        h+='<div class="bl"><b>'+list[k].l+'</b><span>'+list[k].d+'</span><em>'+(list[k].m<=0?"ya":(list[k].m<60?list[k].m+" min":list[k].t))+'</em></div>';}
      box.innerHTML=h;
      var d=new Date();$("busup").textContent="Actualizado a las "+dos(d.getHours())+":"+dos(d.getMinutes());
    },fail);
  },fail);
}

/* --- calendario --- */
$("cal").innerHTML=CFG.calUrl?'<iframe src="'+CFG.calUrl+'"></iframe>':'<p>📅 Falta la dirección del calendario de Google. Ponla en la configuración (calUrl).</p>';

/* --- lista de la compra --- */
var sel={};try{sel=JSON.parse(ls("lista")||"{}");}catch(e){}
function drawItems(){
  var h="",i;
  for(i=0;i<ITEMS.length;i++){h+='<div class="it'+(sel[i]?" sel":"")+'" data-i="'+i+'"><div><span>'+ITEMS[i][0]+'</span>'+ITEMS[i][1]+'</div></div>';}
  $("items").innerHTML=h;
}
$("items").addEventListener("click",function(e){
  var n=e.target;while(n&&!n.getAttribute("data-i")){n=n.parentNode;if(n===document)return;}
  if(!n)return;var i=n.getAttribute("data-i");sel[i]=!sel[i];ls("lista",JSON.stringify(sel));drawItems();
});
$("clr").addEventListener("click",function(){if(confirm("¿Vaciar la lista?")){sel={};ls("lista","{}");drawItems();}});
drawItems();

/* --- temporizador --- */
var ac,tEnd=0,tInt=null,aInt=null;
function ainit(){try{var C=window.AudioContext||window.webkitAudioContext;if(!ac&&C)ac=new C();if(ac&&ac.resume)ac.resume();}catch(e){}}
function beep(){if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=0.3;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.3);}
function tshow(s){$("tdisp").textContent=dos(Math.floor(s/60))+":"+dos(s%60);}
function ttick(){var s=Math.ceil((tEnd-Date.now())/1000);if(s<=0){clearInterval(tInt);tInt=null;tshow(0);alarm();return;}tshow(s);}
function tstart(sec){ainit();tEnd=Date.now()+sec*1000;clearInterval(tInt);tInt=setInterval(ttick,250);ttick();}
function alarm(){var n=0;$("alarm").className="on";beep();clearInterval(aInt);aInt=setInterval(function(){beep();if(++n>8){clearInterval(aInt);}},1200);}
$("alarm").addEventListener("click",function(){$("alarm").className="";clearInterval(aInt);});
var pre=[1,3,5,10,15,30],ph="",q;
for(q=0;q<pre.length;q++){ph+='<button data-m="'+pre[q]+'">'+pre[q]+' min</button>';}
$("tpre").innerHTML=ph;
$("tpre").addEventListener("click",function(e){var m=e.target.getAttribute("data-m");if(m)tstart(+m*60);});
$("tplus").addEventListener("click",function(){if(tInt){tEnd+=60000;ttick();}else{tstart(60);}});
$("tstop").addEventListener("click",function(){clearInterval(tInt);tInt=null;tshow(0);});

/* --- pestañas --- */
var tabs=document.querySelectorAll("#tabs button");
for(q=0;q<tabs.length;q++){tabs[q].addEventListener("click",function(){
  var t=document.querySelectorAll("#tabs button"),j;
  for(j=0;j<t.length;j++){t[j].className="";$(t[j].getAttribute("data-s")).className="screen"+(t[j]===this?"":" off");}
  this.className="on";});}

tick();setInterval(tick,5000);
rain();setInterval(rain,300000);
bus(0);bus(1);setInterval(function(){bus(0);bus(1);},60000);
setInterval(function(){location.reload();},6*3600*1000);
})();
</script>
</body>
</html>
